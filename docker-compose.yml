version: "3.9"

services:
  ai-guardian:
    build: .
    container_name: ai-guardian
    restart: unless-stopped
    ports:
      - "${AI_GUARDIAN_PORT:-8000}:8000"
    env_file:
      - .env
    environment:
      AI_GUARDIAN_DB_PATH: /app/data/ai_guardian.db
      PORT: 8000
    volumes:
      - ai_guardian_data:/app/data

volumes:
  ai_guardian_data:
